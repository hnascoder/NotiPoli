<section class="titulo-pagina">
  <div class="container">
    <h1>Mis favoritos</h1>
    <p class="mb-0">Las noticias que guardaste para leer después (se guardan en este navegador).</p>
  </div>
</section>

<main class="container my-4">
  <div class="row">
    @for (n of favoritas(); track n.id) {
      <div class="col-12 mb-3">
        <div class="card fila-favorito">
          <div class="row g-0 align-items-center">
            <div class="col-4 col-md-2">
              <img [src]="n.imagen" class="img-fluid rounded-start" [alt]="n.titulo">
            </div>
            <div class="col-8 col-md-10">
              <div class="card-body d-md-flex justify-content-between align-items-center">
                <div>
                  <span class="badge etiqueta">{{ n.categoria }}</span>
                  <h6 class="mt-2 mb-1">{{ n.titulo }}</h6>
                </div>
                <div class="mt-2 mt-md-0 text-nowrap">
                  <a [routerLink]="['/noticia', n.id]" class="btn btn-sm btn-principal me-1">Ver</a>
                  <button class="btn btn-sm btn-outline-danger" (click)="quitar(n.id)">Quitar</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    } @empty {
      @if (cargado()) {
        <div class="alert alert-info">
          Todavía no tienes noticias favoritas. <a routerLink="/noticias">Mira las noticias</a> y usa el botón "Agregar a favoritos".
        </div>
      }
    }
  </div>
</main>
